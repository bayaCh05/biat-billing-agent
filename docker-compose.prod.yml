services:

  app:
    image: baya05/biat-billing:latest
    container_name: biat_billing_app
    ports:
      - "8501:8501"
    volumes:
      - biat_data:/app/data
      - biat_exports:/app/exports
      - biat_invoices:/app/invoices
      - biat_uploads:/app/uploads
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_URL=sqlite:////app/data/biat_billing.db
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - biat_network

  ollama:
    image: ollama/ollama:latest
    container_name: biat_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - biat_network

volumes:
  biat_data:
  biat_exports:
  biat_invoices:
  biat_uploads:
  ollama_models:

networks:
  biat_network:
    driver: bridge
