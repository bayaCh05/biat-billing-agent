name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-fra \
            libpoppler-cpp-dev \
            poppler-utils \
            libmagic1

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Initialize test database
        run: |
          python -c "
          from src.storage.db import build_engine, init_db
          engine = build_engine('sqlite:///./data/invoices.db')
          init_db(engine)
          "

      - name: Run tests
        run: pytest --tb=short -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .pytest_cache/

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: biat-billing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container starts
        run: |
          docker run -d --name test_app \
            -p 8501:8501 \
            -e DATABASE_URL=sqlite:////app/data/biat_billing.db \
            biat-billing:latest
          sleep 15
          curl -f http://localhost:8501/_stcore/health
          docker stop test_app
