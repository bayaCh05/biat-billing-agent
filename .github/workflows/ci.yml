name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-fra \
            libpoppler-cpp-dev \
            poppler-utils \
            libmagic1

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Initialize test database
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/invoices.db
        run: |
          python -c "
          import os
          from src.storage.db import build_engine, init_db
          engine = build_engine(os.environ['DATABASE_URL'])
          init_db(engine)
          "

      - name: Run tests
        run: pytest --tb=short -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: test-results.xml

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: biat-billing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container starts
        run: |
          docker run -d --name test_app \
            -p 8501:8501 \
            -e DATABASE_URL=sqlite:////app/data/biat_billing.db \
            biat-billing:latest
          sleep 15
          curl -f http://localhost:8501/_stcore/health
          docker stop test_app

  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biat-billing:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biat-billing:${{ github.sha }}
