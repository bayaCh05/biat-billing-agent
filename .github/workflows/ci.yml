name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  test:
    name: Run tests
    runs-on: ubuntu-latest

    # Ephemeral, isolated CI container — no real data ever touches it, so it
    # deliberately skips docker-compose.yml's `--auth` requirement (that's a
    # data-residency control for the persistent dev/prod volume, not needed
    # here). Mongo-native code paths gate cleanly on MONGODB_URI being unset
    # (see CLAUDE.md), so this is additive: it only makes those paths actually
    # exercised in CI instead of silently skipped.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-fra \
            libpoppler-cpp-dev \
            poppler-utils \
            libmagic1

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Apply database migrations
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/invoices.db
        run: alembic upgrade head

      - name: Run tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: biat_billing_ci
        run: pytest --tb=short -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: test-results.xml

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: biat-billing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container starts
        run: |
          docker run -d --name test_app \
            -p 8000:8000 \
            -e DATABASE_URL=sqlite:////app/data/invoices.db \
            biat-billing:latest
          sleep 15
          curl -f http://localhost:8000/api/health
          docker stop test_app

  publish:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/biat-billing:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/biat-billing:${{ github.sha }}
