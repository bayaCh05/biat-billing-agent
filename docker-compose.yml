services:
  # ── Local SMTP server for development email testing ──────────────────────────
  # Web UI to view sent emails: http://localhost:8025
  # SMTP server: localhost:1025
  # DEV ONLY — gated behind the "dev" profile so plain `docker compose up -d`
  # does NOT start this by default. Its web UI has no authentication and
  # shows every email sent through it, including OTP codes and password
  # reset links — never run this on anything network-reachable beyond your
  # own dev machine. In a real deployment, set SMTP_HOST/SMTP_PORT (+ auth
  # vars) in .env to a real mail relay instead, and don't use this profile.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: biat_mailhog
    profiles: ["dev"]
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  # ── MongoDB (migration SQLite → MongoDB, Phase 7) ─────────────────────────────
  # DATA RESIDENCY: local container only, bound to 127.0.0.1 — never expose
  # this port publicly or point MONGODB_URI at a cloud cluster with real data.
  # Auth is required (--auth). MONGO_INITDB_ROOT_USERNAME/PASSWORD only bootstrap
  # a root user on a brand-new empty volume — for an existing volume, create the
  # user manually first (mongosh admin --eval 'db.createUser(...)') before this
  # takes effect, or auth will be enforced with no user able to log in.
  mongo:
    image: mongo:7
    container_name: biat_mongo
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-biat_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - biat_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      # `ping` is one of the few commands MongoDB allows pre-auth even with
      # --auth enabled — deliberately not passing credentials here so they
      # never show up in `docker inspect`'s healthcheck command history.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Backend API + compiled React SPA (single combined image) ──────────────────
  # api/main.py mounts frontend/dist/ as static files + SPA fallback when it
  # exists — the Dockerfile builds that dist/ in a first stage and copies it
  # into this image, so there is deliberately no separate frontend service/
  # image here (no nginx config exists in this repo).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biat_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides for the values in .env that are correct for host-based dev
      # (localhost) but wrong from inside this container's network namespace.
      MONGODB_URI: "mongodb://${MONGO_ROOT_USER:-biat_admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker 20.10+) —
      # Mac/Windows Docker Desktop already provide it natively. Ollama runs
      # on the host, never containerized — see README.md "Ollama" section.
      - "host.docker.internal:host-gateway"
    volumes:
      - biat_data:/app/data          # invoices.db (SQLite, still required), uploads/, chromadb/
      - biat_exports:/app/exports
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  biat_mongo_data:
  biat_data:
  biat_exports:
