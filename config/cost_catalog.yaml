# Catalogue des coûts et produits — BIAT IT
# ============================================================
# Ce fichier est la source de vérité de la structure financière de BIAT IT.
# Il est conçu pour être éditable par un non-développeur.
#
# Champs obligatoires par entrée :
#   id          : identifiant unique snake_case
#   label       : libellé comptable complet
#   compte      : numéro de compte (Plan Comptable des Entreprises tunisien)
#   nature      : fixe | variable | semi_variable
#   type_charge : OPEX (consommé) | CAPEX (immobilisé, amorti)
#   tva_rate    : taux TVA en % — indicatif, à confirmer avec le comptable
#   recurrence  : mensuelle | annuelle | ponctuelle | irreguliere
#   flux        : fournisseur (sortie argent) | client (entrée argent) | interne
#   keywords    : mots-clés pour la classification automatique (insensible à la casse et aux accents)
#
# ATTENTION : les taux TVA et codes comptables sont indicatifs.
# Ils doivent être validés avec l'équipe finance avant mise en production.
# ============================================================

