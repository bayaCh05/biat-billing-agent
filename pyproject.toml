[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# This repo is never imported as an installed package — the app always runs
# via PYTHONPATH=backend + uvicorn (see README/CLAUDE.md), both locally and
# in Docker. `pip install -e .` is only ever used to install the dependency
# list below into a venv. Without this, setuptools refuses to build at all:
# it auto-discovers every top-level directory (data/, exports/, logs/,
# config/, docker/, backend/, frontend/) as a candidate package and aborts
# on the ambiguity.
[tool.setuptools]
packages = []

[project]
name = "invoice-agent"
version = "0.1.0"
description = "Intelligent invoice processing and accounting follow-up agent for BIAT IT"
requires-python = ">=3.11"
dependencies = [
    # Data models & validation
    "pydantic>=2.7",

    # Database & ORM
    "sqlalchemy>=2.0",
    "alembic>=1.13",

    # PDF processing (native)
    "pdfplumber>=0.11",
    "pymupdf>=1.24",          # fitz — PDF to image, fast text extraction

    # OCR
    "pytesseract>=0.3",       # OCR engine

    # Image preprocessing
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",

    # Arabic/bidi text handling
    "python-bidi>=0.6",
    "arabic-reshaper>=3.0",

    # LLM backend — Ollama only (data residency: local inference)
    "ollama>=0.2",
    # src/ai_agents/ollama_client.py calls the Ollama HTTP API directly via
    # `requests`, not the ollama>=0.2 client library above — currently only
    # pulled in transitively (via chromadb); declared explicitly since it's
    # a direct import on the critical LLM call path, not something that
    # should depend on another package's transitive dependency tree.
    "requests>=2.31",

    # RAG — local vector store + embeddings for classification Pass C
    "chromadb>=1.5",
    "sentence-transformers>=5.5",

    # Fuzzy matching (duplicate detection + catalog matching)
    "rapidfuzz>=3.9",

    # ML fallback classifier
    "scikit-learn>=1.5",
    "scikit-image>=0.22",
    "joblib>=1.4",

    # PDF generation (client invoices)
    "fpdf2>=2.8",

    # REST API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "limits>=3.6",

    # Nightly job scheduling (api/scheduler.py) — was missing from this list
    # entirely (only present by accident in dev venvs), which crashed every
    # fresh install (Docker included) at startup with ModuleNotFoundError.
    "apscheduler>=3.10",

    # Configuration & environment
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Structured logging
    "structlog>=24.2",

    # MIME type detection
    "python-magic>=0.4",

    # Authentification LDAP (serveur d'annuaire d'entreprise)
    "ldap3>=2.9",

    # Password hashing — argon2id (primary) + bcrypt (legacy verification during migration)
    "argon2-cffi>=23.1",
    "bcrypt>=4.0",

    # MongoDB — Phase 1 migration (coexiste avec SQLAlchemy durant la migration)
    "motor>=3.4",      # driver asyncio officiel MongoDB (wraps pymongo)
    # Pinned <2.1, not just >=2.0: beanie 2.1.0 (resolved by any fresh install
    # without this bound) breaks init_beanie() against motor 3.7.1/pymongo
    # 4.17.0 — "AsyncIOMotorClient object is not callable... no such method
    # append_metadata" at startup, silently leaves the app SQLite-only.
    # Reproduced in the Docker image (2026-07-17); 2.0.0 (already pinned in
    # dev venvs by accident) works. Re-verify before lifting this bound.
    "beanie>=2.0,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "backend"]
